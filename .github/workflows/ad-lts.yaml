# PACKAGE-OWNED — not written by EpiAwarePackageTools.scaffold.
name: AD (LTS)

# Runs the AD gradient suite on the Julia LTS. The managed AD workflow runs on
# Julia `1` only, but an Enzyme gradient can be correct on 1.12 and wrong on
# 1.10 and 1.11 (EnzymeAD/Enzyme.jl#714). The reusable AD workflow cannot be
# used here because Pkg ignores `[sources]` before 1.11. This job develops the
# path packages itself. It uploads no coverage, leaving the per-backend flags
# to the managed workflow.

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ad-lts:
    name: ${{ matrix.backend }} (Julia LTS)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        backend:
          - forwarddiff
          - reversediff
          - reversediff_compiled
          - enzyme_forward
          - enzyme_reverse
          - mooncake_reverse
          - mooncake_forward
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: lts
      - uses: julia-actions/cache@v3
      - name: Develop the path packages and instantiate test/ad
        run: >-
          julia --project=test/ad -e 'using Pkg;
          Pkg.develop([PackageSpec(path = "test/ADFixtures"),
          PackageSpec(path = ".")]); Pkg.instantiate()'
      - name: Run AD gradient tests
        run: julia --project=test/ad test/ad/runtests.jl ${{ matrix.backend }}

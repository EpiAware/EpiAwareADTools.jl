# Bounded compat for the seeded QA + AD deps (mirrors CensoredDistributions.jl).
# The package under test is pinned by `[sources]`, so it carries no compat
# entry. Add a bound for each test-only dep you add.
[compat]
ADTypes = "1"
Aqua = "0.8"
BenchmarkTools = "1"
DifferentiationInterface = "0.6, 0.7"
DifferentiationInterfaceTest = "0.9, 0.10, 0.11"
# Floored at 0.25.92: matches the main Project.toml floor (see there for why).
Distributions = "0.25.92"
Documenter = "1"
EpiAwarePackageTools = "0.3, 0.4"
ExplicitImports = "1"
ForwardDiff = "0.10, 1"
JET = "0.9, 0.10, 0.11, 0.12"
LogExpFunctions = "0.3, 1"
Pkg = "1"
Runic = "1"
SurvivalDistributions = "0.1"
Test = "1"
TestItemRunner = "1"
TestItems = "1"

[sources]
EpiAwareADTools = {path = ".."}
